<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Админка магазина</title><style>:root{--bg:#f3f6f7;--card:#fff;--ink:#17323a;--mute:#5d7279;--line:#d5e0e3;--acc:#f2b632;--danger:#c0392b}@media(prefers-color-scheme:dark){:root{--bg:#0f1f24;--card:#172b32;--ink:#e8f1f3;--mute:#93a9af;--line:#26414a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.w{max-width:1000px;margin:auto;padding:16px}h1{margin:0 0 12px}h2{margin:24px 0 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}label{display:block;font-size:13px;color:var(--mute);margin-top:8px}button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}.pri{background:var(--acc);border-color:var(--acc);color:#3a2a00;font-weight:700}.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.r>*{flex:1 1 150px}.r>button{flex:0 0 auto}.m{color:var(--mute);font-size:14px}.err{color:var(--danger);min-height:20px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{width:82px;height:82px;object-fit:cover;border-radius:8px;background:var(--line)}.p{display:flex;gap:10px;align-items:center}.p .t{flex:1}.order-actions{display:flex;gap:8px;align-items:center;margin-top:8px}.status-done{opacity:.72}.help{background:#fff8df;border:1px solid #ead99a;border-radius:10px;padding:10px;font-size:14px}</style></head><body><div class="w"><h1>Админка</h1><div class="err" id="err"></div><div id="app" hidden><h2>Контакты менеджера</h2><div class="card"><div class="help">Эти данные сохраняются в базе и меняются без редеплоя. Ссылка MAX будет показана клиенту после заказа.</div><label>Имя менеджера</label><input id="mn"><label>Телефон менеджера</label><input id="mp" type="tel" placeholder="+7 ..."><label>Ссылка MAX</label><input id="mx" placeholder="https://max.ru/id..."><label>Ссылка Telegram</label><input id="tg" placeholder="https://t.me/..."><button class="pri" id="saveSettings" style="margin-top:10px">Сохранить контакты</button></div><h2>Товар</h2><div class="card"><input type="hidden" id="id"><label>Название</label><input id="n"><div class="r"><div><label>Категория</label><input id="c" value="Посуда"></div><div><label>Цена, ₽</label><input id="pr" type="number" min="0"></div><div><label>Порядок</label><input id="so" type="number" value="0"></div></div><label>Описание</label><textarea id="d" rows="2"></textarea><label>Фото и видео (до 12 файлов, каждый до 25 МБ)</label><input id="f" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple><div class="m" id="fs"></div><div class="thumbs" id="thumbs"></div><label><input id="a" type="checkbox" checked style="width:auto"> Показывать в магазине</label><div class="r" style="margin-top:10px"><button class="pri" id="save">Сохранить</button><button id="reset">Очистить форму</button></div></div><h2>Товары</h2><div id="plist"></div><h2>Заказы</h2><div id="olist"></div></div></div><script>var $=id=>document.getElementById(id),T=sessionStorage.getItem('t')||'',img='',gallery=[];const esc=s=>{let d=document.createElement('div');d.textContent=s??'';return d.innerHTML};function api(m,u,b,raw){let o={method:m,headers:{'x-admin-token':T}};if(b&&!raw){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}else if(b)o.body=b;return fetch(u,o).then(r=>r.json().then(j=>{if(!r.ok)throw new Error(j.error||'Ошибка');return j}))}function login(){T=prompt('Пароль администратора')||'';sessionStorage.setItem('t',T);load()}function showGallery(){$('thumbs').innerHTML=gallery.map(m=>m.media_type==='video'?'<video class="thumb" src="'+esc(m.url)+'" controls muted></video>':'<img class="thumb" src="'+esc(m.url)+'">').join('')}function clear(){['id','n','pr','d','f'].forEach(i=>$(i).value='');$('c').value='Посуда';$('so').value=0;$('a').checked=true;img='';gallery=[];$('fs').textContent='';showGallery()}function load(){api('GET','/api/admin/products').then(ps=>{$('err').textContent='';$('app').hidden=false;window.PS=ps;$('plist').innerHTML=ps.map(p=>'<div class="card p"><div class="t"><b>'+esc(p.name)+'</b> — '+p.price+' ₽<div class="m">'+esc(p.category)+(p.active?'':' · скрыт')+' · '+(p.media||[]).length+' медиа</div></div><button data-e="'+p.id+'">Изменить</button><button data-x="'+p.id+'">Удалить</button></div>').join('')||'<div class="m">Товаров нет</div>';return Promise.all([api('GET','/api/admin/orders'),api('GET','/api/admin/settings')])}).then(([os,s])=>{let S={new:'Новый',processing:'В работе',done:'Выполнен',cancelled:'Отменён'};$('olist').innerHTML=os.map(o=>'<div class="card '+(o.status==='done'?'status-done':'')+'"><b>№'+o.id+'</b> · '+new Date(o.created_at).toLocaleString('ru-RU')+' · '+o.total+' ₽<div class="m">'+esc(o.name)+', '+esc(o.phone)+'<br>'+esc(o.address)+(o.comment?'<br>'+esc(o.comment):'')+'</div><div>'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</div><div class="order-actions"><select data-s="'+o.id+'">'+Object.keys(S).map(k=>'<option value="'+k+'"'+(o.status===k?' selected':'')+'>'+S[k]+'</option>').join('')+'</select>'+(o.status==='done'||o.status==='cancelled'?'<button class="danger" data-do="'+o.id+'">Удалить</button>':'')+'</div></div>').join('')||'<div class="m">Заказов пока нет</div>';$('mn').value=s.manager_name||'';$('mp').value=s.manager_phone||'';$('mx').value=s.manager_max_url||'';$('tg').value=s.manager_telegram_url||''}).catch(e=>{$('err').textContent=e.message;if(e.message==='Неверный пароль'){$('app').hidden=true;$('err').innerHTML='Неверный пароль. <button id="li">Войти</button>'}})}document.addEventListener('change',e=>{if(e.target.id==='f'){gallery=[];[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{gallery.push({url:r.result,media_type:f.type.startsWith('video/')?'video':'image',_file:f});showGallery()};r.readAsDataURL(f)})}else if(e.target.dataset.s)api('PATCH','/api/admin/orders/'+e.target.dataset.s,{status:e.target.value}).catch(x=>$('err').textContent=x.message)});document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.id==='li')login();else if(t.id==='reset')clear();else if(t.dataset.e){let p=PS.find(x=>x.id==t.dataset.e);$('id').value=p.id;$('n').value=p.name;$('c').value=p.category;$('pr').value=p.price;$('so').value=p.sort;$('d').value=p.description;$('a').checked=p.active;img=p.image_url||'';gallery=(p.media||[]).map(x=>({url:x.url,media_type:x.media_type}));$('fs').textContent=gallery.length?'Текущая галерея загрузится заново после сохранения':'Галерея пуста';showGallery();scrollTo(0,0)}else if(t.dataset.x){if(confirm('Удалить товар?'))api('DELETE','/api/admin/products/'+t.dataset.x).then(load).catch(e=>$('err').textContent=e.message)}else if(t.id==='saveSettings'){t.disabled=true;api('PUT','/api/admin/settings',{manager_name:$('mn').value,manager_phone:$('mp').value,manager_max_url:$('mx').value,manager_telegram_url:$('tg').value}).then(()=>{$('err').textContent='Контакты сохранены'}).catch(e=>$('err').textContent=e.message).finally(()=>t.disabled=false)}else if(t.id==='save'){t.disabled=true;$('err').textContent='';let files=[...$('f').files];let existing=gallery.filter(x=>!x._file).map(x=>({url:x.url,media_type:x.media_type}));let up=files.length?(()=>{let fd=new FormData();files.forEach(f=>fd.append('files',f));return api('POST','/api/admin/upload',fd,true).then(r=>existing.concat(r.files))})():Promise.resolve(existing);up.then(media=>{let b={name:$('n').value,category:$('c').value,price:$('pr').value,sort:$('so').value,description:$('d').value,active:$('a').checked,image_url:(media.find(m=>m.media_type==='image')||media[0]||{url:img}).url||''};return($('id').value?api('PUT','/api/admin/products/'+$('id').value,b).then(()=>api('POST','/api/admin/products/'+$('id').value+'/media',{media})):api('POST','/api/admin/products',b).then(p=>api('POST','/api/admin/products/'+p.id+'/media',{media}))).then(()=>{clear();load()})}).catch(e=>$('err').textContent=e.message).finally(()=>t.disabled=false)}else if(t.dataset.do){if(confirm('Удалить обработанный заказ?'))api('DELETE','/api/admin/orders/'+t.dataset.do).then(load).catch(e=>$('err').textContent=e.message)}});T?load():login();</script></body></html>
