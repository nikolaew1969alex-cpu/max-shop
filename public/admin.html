<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Админка магазина</h1><p>Добавление товаров</p></div></header><main><section class="panel"><label>Пароль администратора<input id="pass" type="password"></label></section><section class="panel"><h2>Добавить товар</h2><label>Фото<input id="image" type="file" accept="image/*"></label><label>Название<input id="name"></label><label>Цена, ₽<input id="price" type="number" min="1"></label><label>Описание<textarea id="description"></textarea></label><label>Остаток<input id="stock" type="number" min="0" value="1"></label><button class="primary" onclick="addProduct()">Сохранить товар</button></section><section class="panel"><h2>Товары</h2><div id="list"></div></section></main><script>async function load(){const r=await fetch('/api/products');const ps=await r.json();document.getElementById('list').innerHTML=ps.map(p=>`<div class="cartrow"><span><b>${p.name}</b> — ${p.price} ₽</span><button onclick="del('${p.id}')">Удалить</button></div>`).join('')||'Товаров пока нет'}async function addProduct(){const fd=new FormData();fd.append('name',document.getElementById('name').value);fd.append('price',document.getElementById('price').value);fd.append('description',document.getElementById('description').value);fd.append('stock',document.getElementById('stock').value);const f=document.getElementById('image').files[0];if(f)fd.append('image',f);const r=await fetch('/api/admin/products',{method:'POST',headers:{'x-admin-password':document.getElementById('pass').value},body:fd});const d=await r.json();if(!r.ok)return alert(d.error);document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('description').value='';document.getElementById('image').value='';load()}async function del(id){if(!confirm('Удалить товар?'))return;await fetch('/api/admin/products/'+id,{method:'DELETE',headers:{'x-admin-password':document.getElementById('pass').value}});load()}load()</script></body></html>
