<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Админка магазина</h1><p>Товары и заказы</p></div></header><main><section class="panel"><label>Пароль администратора<input id="pass" type="password"></label></section><section class="panel"><h2 id="formTitle">Добавить товар</h2><label>Фото<input id="image" type="file" accept="image/*"></label><div id="currentImage" class="hint"></div><label>Название<input id="name"></label><label>Цена, ₽<input id="price" type="number" min="1"></label><label>Описание<textarea id="description"></textarea></label><label>Остаток<input id="stock" type="number" min="0" value="1"></label><button id="saveBtn" class="primary" onclick="saveProduct()">Сохранить товар</button><button id="cancelBtn" class="secondary hidden" onclick="cancelEdit()">Отменить редактирование</button></section><section class="panel"><h2>Товары</h2><div id="list"></div></section><section class="panel"><div class="row"><h2 style="margin:0">Заказы</h2><button onclick="loadOrders()">Обновить</button></div><div id="orders"><div class="empty">Введите пароль и нажмите «Обновить».</div></div></section></main><script>const $=id=>document.getElementById(id);let products=[];let editingId=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' ₽'}function auth(){return {'x-admin-password':$('pass').value}}async function load(){const r=await fetch('/api/products');products=await r.json();$('list').innerHTML=products.map(p=>`<div class="cartrow"><span><b>${esc(p.name)}</b> — ${money(p.price)} · остаток ${Number(p.stock)||0}</span><span style="display:flex;gap:8px"><button onclick="editProduct('${p.id}')">Изменить</button><button onclick="del('${p.id}')">Удалить</button></span></div>`).join('')||'Товаров пока нет';loadOrders()}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('formTitle').textContent='Редактировать товар';$('saveBtn').textContent='Сохранить изменения';$('cancelBtn').classList.remove('hidden');$('name').value=p.name||'';$('price').value=p.price??'';$('description').value=p.description||'';$('stock').value=p.stock??0;$('image').value='';$('currentImage').innerHTML=p.image?`Текущее фото сохранено. Чтобы заменить его, выберите новый файл.`:'Фото нет — можно добавить файл.';window.scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){editingId=null;$('formTitle').textContent='Добавить товар';$('saveBtn').textContent='Сохранить товар';$('cancelBtn').classList.add('hidden');$('name').value='';$('price').value='';$('description').value='';$('stock').value=1;$('image').value='';$('currentImage').textContent=''}async function saveProduct(){const fd=new FormData();fd.append('name',$('name').value);fd.append('price',$('price').value);fd.append('description',$('description').value);fd.append('stock',$('stock').value);const f=$('image').files[0];if(f)fd.append('image',f);const url=editingId?'/api/admin/products/'+editingId:'/api/admin/products';const method=editingId?'PUT':'POST';const r=await fetch(url,{method,headers:auth(),body:fd});const d=await r.json();if(!r.ok)return alert(d.error||'Ошибка');cancelEdit();load()}async function loadOrders(){const box=$('orders');if(!$('pass').value){box.innerHTML='<div class="empty">Введите пароль администратора.</div>';return}const r=await fetch('/api/admin/orders',{headers:auth()});const d=await r.json();if(!r.ok){box.innerHTML=`<div class="empty">${esc(d.error||'Не удалось загрузить заказы')}</div>`;return}if(!d.length){box.innerHTML='<div class="empty">Заказов пока нет.</div>';return}box.innerHTML=d.slice().reverse().map(o=>{const items=(o.items||[]).map(i=>`<div>${esc(i.name)} × ${Number(i.qty)||0} — <b>${money((Number(i.price)||0)*(Number(i.qty)||0))}</b></div>`).join('');const total=(o.items||[]).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||0),0);const date=o.createdAt?new Date(o.createdAt).toLocaleString('ru-RU'):'—';return `<div class="panel" style="margin:12px 0;background:#f7f7f7"><div class="row"><b>${esc(o.id)}</b><span>${esc(o.status==='new'?'Новый':o.status||'Новый')}</span></div><p><b>${esc(o.customer?.name||'Без имени')}</b><br>Телефон: ${esc(o.customer?.phone||'—')}<br>Доставка: ${esc(o.delivery||'—')}<br>Дата: ${esc(date)}</p><div>${items}</div><hr><div><b>Итого: ${money(total)}</b></div></div>`}).join('')}async function del(id){if(!confirm('Удалить товар?'))return;await fetch('/api/admin/products/'+id,{method:'DELETE',headers:auth()});load()}load()</script></body></html>
