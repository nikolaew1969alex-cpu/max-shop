<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Админка магазина</h1><p>Товары и заказы</p></div></header><main><section class="panel"><label>Пароль администратора<input id="pass" type="password"></label></section><section class="panel"><h2>Добавить товар</h2><label>Фото<input id="image" type="file" accept="image/*"></label><label>Название<input id="name"></label><label>Цена, ₽<input id="price" type="number" min="1"></label><label>Описание<textarea id="description"></textarea></label><label>Остаток<input id="stock" type="number" min="0" value="1"></label><button class="primary" onclick="addProduct()">Сохранить товар</button></section><section class="panel"><h2>Товары</h2><div id="list"></div></section><section class="panel"><div class="row"><h2 style="margin:0">Заказы</h2><button onclick="loadOrders()">Обновить</button></div><div id="orders"><div class="empty">Введите пароль и нажмите «Обновить».</div></div></section></main><script>const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' ₽'}function auth(){return {'x-admin-password':$('pass').value}}async function load(){const r=await fetch('/api/products');const ps=await r.json();$('list').innerHTML=ps.map(p=>`<div class="cartrow"><span><b>${esc(p.name)}</b> — ${money(p.price)}</span><button onclick="del('${p.id}')">Удалить</button></div>`).join('')||'Товаров пока нет';loadOrders()}async function loadOrders(){const box=$('orders');if(!$('pass').value){box.innerHTML='<div class="empty">Введите пароль администратора.</div>';return}const r=await fetch('/api/admin/orders',{headers:auth()});const d=await r.json();if(!r.ok){box.innerHTML=`<div class="empty">${esc(d.error||'Не удалось загрузить заказы')}</div>`;return}if(!d.length){box.innerHTML='<div class="empty">Заказов пока нет.</div>';return}box.innerHTML=d.slice().reverse().map(o=>{const items=(o.items||[]).map(i=>`<div>${esc(i.name)} × ${Number(i.qty)||0} — <b>${money((Number(i.price)||0)*(Number(i.qty)||0))}</b></div>`).join('');const total=(o.items||[]).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||0),0);const date=o.createdAt?new Date(o.createdAt).toLocaleString('ru-RU'):'—';return `<div class="panel" style="margin:12px 0;background:#f7f7f7"><div class="row"><b>${esc(o.id)}</b><span>${esc(o.status==='new'?'Новый':o.status||'Новый')}</span></div><p><b>${esc(o.customer?.name||'Без имени')}</b><br>Телефон: ${esc(o.customer?.phone||'—')}<br>Доставка: ${esc(o.delivery||'—')}<br>Дата: ${esc(date)}</p><div>${items}</div><hr><div><b>Итого: ${money(total)}</b></div></div>`}).join('')}async function addProduct(){const fd=new FormData();fd.append('name',$('name').value);fd.append('price',$('price').value);fd.append('description',$('description').value);fd.append('stock',$('stock').value);const f=$('image').files[0];if(f)fd.append('image',f);const r=await fetch('/api/admin/products',{method:'POST',headers:auth(),body:fd});const d=await r.json();if(!r.ok)return alert(d.error);$('name').value='';$('price').value='';$('description').value='';$('image').value='';load()}async function del(id){if(!confirm('Удалить товар?'))return;await fetch('/api/admin/products/'+id,{method:'DELETE',headers:auth()});load()}load()</script></body></html>
