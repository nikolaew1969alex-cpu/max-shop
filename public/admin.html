<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Админка магазина</h1><p>Товары и заказы</p></div></header><main><section class="panel"><label>Пароль администратора<input id="pass" type="password"></label></section><section class="panel"><h2>Менеджер</h2><p class="hint">Укажите контакты менеджера. На витрине будут показаны только заполненные способы связи.</p><label>Телефон менеджера<input id="managerPhone" type="tel" placeholder="+7 900 123-45-67"></label><label>Ссылка для связи с менеджером в MAX<input id="managerMaxLink" type="url" placeholder="https://max.ru/id781702603971_bot"></label><button id="saveSettings" class="primary" onclick="saveSettings()">Сохранить настройки</button><span id="settingsStatus" class="hint"></span></section><section class="panel"><h2 id="formTitle">Добавить товар</h2><label>Фотографии — до 6 штук<input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><span class="hint">Выберите несколько фотографий одновременно. На телефоне можно выбрать несколько файлов через «Выбрать».</span></label><div id="mediaPreview" class="media-preview"></div><label>Видео — MP4 или WebM<input id="video" type="file" accept="video/mp4,video/webm"></label><div id="currentMedia" class="hint"></div><label>Название<input id="name"></label><label>Цена, ₽<input id="price" type="number" min="1"></label><label>Описание<textarea id="description"></textarea></label><label>Остаток<input id="stock" type="number" min="0" value="1"></label><button id="saveBtn" class="primary" onclick="saveProduct()">Сохранить товар</button><button id="cancelBtn" class="secondary hidden" onclick="cancelEdit()">Отменить редактирование</button></section><section class="panel"><h2>Товары</h2><div id="list"></div></section><section class="panel"><div class="row"><h2 style="margin:0">Заказы</h2><button onclick="loadOrders()">Обновить</button></div><div id="orders"><div class="empty">Введите пароль и нажмите «Обновить».</div></div></section></main><script>const $=id=>document.getElementById(id);let products=[];let editingId=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' ₽'}function auth(){return {'x-admin-password':$('pass').value}}function parseManagerSettings(v){try{const x=JSON.parse(v||'');if(x&&typeof x==='object')return{phone:String(x.phone||''),maxLink:String(x.maxLink||'')}}catch(e){}return{phone:String(v||''),maxLink:''}}async function loadSettings(){if(!$('pass').value)return;const r=await fetch('/api/admin/settings',{headers:auth()});if(!r.ok)return;const d=await r.json(),s=parseManagerSettings(d.managerPhone);$('managerPhone').value=s.phone;$('managerMaxLink').value=s.maxLink}async function saveSettings(){if(!$('pass').value)return alert('Сначала введите пароль администратора');const phone=$('managerPhone').value.trim(),maxLink=$('managerMaxLink').value.trim();if(maxLink&&!/^https:\/\/(max\.ru|www\.max\.ru)\//i.test(maxLink))return alert('Ссылка MAX должна начинаться с https://max.ru/');const r=await fetch('/api/admin/settings',{method:'PUT',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({managerPhone:JSON.stringify({phone,maxLink})})});const d=await r.json();if(!r.ok)return alert(d.error||'Не удалось сохранить настройки');$('settingsStatus').textContent='Сохранено ✓';setTimeout(()=>$('settingsStatus').textContent='',2000)}function mediaPreview(){const box=$('mediaPreview'),files=[...$('images').files],video=$('video').files[0];box.innerHTML=(files.length?`<div class="hint">Выбрано фото: <b>${files.length}</b> из 6</div>`:'')+files.map(f=>`<div class="media-thumb"><img src="${URL.createObjectURL(f)}" alt=""><small>${esc(f.name)}</small></div>`).join('')+(video?`<div class="media-thumb"><video src="${URL.createObjectURL(video)}" muted controls></video><small>${esc(video.name)}</small></div>`:'')}$('images').onchange=()=>{if($('images').files.length>6){alert('Можно выбрать максимум 6 фотографий');$('images').value=''}mediaPreview()};$('video').onchange=mediaPreview;async function load(){const r=await fetch('/api/products');products=await r.json();$('list').innerHTML=products.map(p=>`<div class="cartrow"><span><b>${esc(p.name)}</b> — ${money(p.price)} · фото ${p.images?.length||(p.image?1:0)}${p.video?' · видео':''} · остаток ${Number(p.stock)||0}</span><span style="display:flex;gap:8px"><button onclick="editProduct('${p.id}')">Изменить</button><button onclick="del('${p.id}')">Удалить</button></span></div>`).join('')||'Товаров пока нет';loadSettings();loadOrders()}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('formTitle').textContent='Редактировать товар';$('saveBtn').textContent='Сохранить изменения';$('cancelBtn').classList.remove('hidden');$('name').value=p.name||'';$('price').value=p.price??'';$('description').value=p.description||'';$('stock').value=p.stock??0;$('images').value='';$('video').value='';$('mediaPreview').innerHTML='';const imgs=p.images?.length?p.images:(p.image?[p.image]:[]);$('currentMedia').innerHTML=imgs.map((u,i)=>`<img class="media-thumb" src="${u}" alt="Фото ${i+1}">`).join('')+(p.video?`<video class="media-thumb" src="${p.video}" controls></video>`:'')||'Сохранённых медиа нет.';window.scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){editingId=null;$('formTitle').textContent='Добавить товар';$('saveBtn').textContent='Сохранить товар';$('cancelBtn').classList.add('hidden');$('name').value='';$('price').value='';$('description').value='';$('stock').value=1;$('images').value='';$('video').value='';$('mediaPreview').innerHTML='';$('currentMedia').textContent=''}async function saveProduct(){const fd=new FormData();fd.append('name',$('name').value);fd.append('price',$('price').value);fd.append('description',$('description').value);fd.append('stock',$('stock').value);[...$('images').files].slice(0,6).forEach(f=>fd.append('images',f));if($('video').files[0])fd.append('video',$('video').files[0]);const url=editingId?'/api/admin/products/'+editingId:'/api/admin/products';const method=editingId?'PUT':'POST';const r=await fetch(url,{method,headers:auth(),body:fd});const d=await r.json();if(!r.ok)return alert(d.error||'Ошибка');cancelEdit();load()}async function loadOrders(){const box=$('orders');if(!$('pass').value){box.innerHTML='<div class="empty">Введите пароль администратора.</div>';return}const r=await fetch('/api/admin/orders',{headers:auth()});const d=await r.json();if(!r.ok){box.innerHTML=`<div class="empty">${esc(d.error||'Не удалось загрузить заказы')}</div>`;return}if(!d.length){box.innerHTML='<div class="empty">Заказов пока нет.</div>';return}box.innerHTML=d.slice().reverse().map(o=>{const items=(o.items||[]).map(i=>`<div>${esc(i.name)} × ${Number(i.qty)||0} — <b>${money((Number(i.price)||0)*(Number(i.qty)||0))}</b></div>`).join('');const total=(o.items||[]).reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.qty)||0),0);const date=o.createdAt?new Date(o.createdAt).toLocaleString('ru-RU'):'—';return `<div class="panel" style="margin:12px 0;background:#f7f7f7"><div class="row"><b>${esc(o.id)}</b><span>${esc(o.status==='new'?'Новый':o.status||'Новый')}</span></div><p><b>${esc(o.customer?.name||'Без имени')}</b><br>Телефон: ${esc(o.customer?.phone||'—')}<br>Доставка: ${esc(o.delivery||'—')}<br>Дата: ${esc(date)}</p><div>${items}</div><hr><div class="row"><b>Итого: ${money(total)}</b><button class="danger" onclick="deleteOrder('${esc(o.id)}')">Удалить обработанный</button></div></div>`}).join('')}async function deleteOrder(id){if(!confirm('Удалить этот заказ? Делайте это после его обработки. Заказ будет удалён из базы без возможности восстановления.'))return;const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'DELETE',headers:auth()});const d=await r.json().catch(()=>({}));if(!r.ok)return alert(d.error||'Не удалось удалить заказ');loadOrders()}async function del(id){if(!confirm('Удалить товар?'))return;await fetch('/api/admin/products/'+id,{method:'DELETE',headers:auth()});load()}load()</script></body></html>
