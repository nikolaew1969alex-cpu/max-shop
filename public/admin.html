<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Админка магазина</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#17323a;--mute:#5d7279;--line:#d5e0e3;--acc:#f2b632}
@media (prefers-color-scheme:dark){:root{--bg:#0f1f24;--card:#172b32;--ink:#e8f1f3;--mute:#93a9af;--line:#26414a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}h1{margin:0 0 12px}h2{margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
.pri{background:var(--acc);border-color:var(--acc);color:#3a2a00;font-weight:700}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.r>*{flex:1 1 140px}.r>button{flex:0 0 auto}
.p{display:flex;gap:10px;align-items:center}.p img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--line)}.p .t{flex:1}
.m{color:var(--mute);font-size:14px}.err{color:#c0392b;min-height:20px}
</style></head><body><div class="w">
<h1>Админка</h1><div class="err" id="err" role="alert"></div>
<div id="app" hidden>
<h2>Товар</h2>
<div class="card"><input type="hidden" id="id">
<label for="n">Название</label><input id="n">
<div class="r"><div><label for="c">Категория</label><input id="c" value="Посуда"></div><div><label for="pr">Цена, ₽</label><input id="pr" type="number" min="0"></div><div><label for="so">Порядок</label><input id="so" type="number" value="0"></div></div>
<label for="d">Описание</label><textarea id="d" rows="2"></textarea>
<label for="f">Фото (JPG, PNG, WEBP до 5 МБ)</label><input id="f" type="file" accept="image/*"><div class="m" id="fs"></div>
<label><input id="a" type="checkbox" checked style="width:auto"> Показывать в магазине</label>
<div class="r" style="margin-top:10px"><button class="pri" id="save">Сохранить</button><button id="reset">Очистить форму</button></div></div>
<h2>Товары</h2><div id="plist"></div>
<h2>Заказы</h2><div id="olist"></div></div></div>
<script>
var $=function(i){return document.getElementById(i)},T=sessionStorage.getItem("t")||"",img="";
var esc=function(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML.replace(/"/g,"&quot;")};
function api(m,u,b,raw){var o={method:m,headers:{"x-admin-token":T}};if(b&&!raw){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(b)}else if(b)o.body=b;
  return fetch(u,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Ошибка");return j})})}
function login(){T=prompt("Пароль администратора")||"";sessionStorage.setItem("t",T);load()}
function load(){api("GET","/api/admin/products").then(function(ps){$("err").textContent="";$("app").hidden=false;
  $("plist").innerHTML=ps.map(function(p){return '<div class="card p"><img src="'+esc(p.image_url)+'" alt=""><div class="t"><b>'+esc(p.name)+'</b> — '+p.price+' ₽<div class="m">'+esc(p.category)+(p.active?"":" · скрыт")+'</div></div><button data-e="'+p.id+'">Изменить</button><button data-x="'+p.id+'">Удалить</button></div>'}).join("")||'<div class="m">Товаров нет</div>';
  window.PS=ps;return api("GET","/api/admin/orders")}).then(function(os){
  var S={new:"Новый",processing:"В работе",done:"Выполнен",cancelled:"Отменён"};
  $("olist").innerHTML=os.map(function(o){return '<div class="card"><b>№'+o.id+'</b> · '+new Date(o.created_at).toLocaleString("ru-RU")+' · '+o.total+' ₽<div class="m">'+esc(o.name)+', '+esc(o.phone)+'<br>'+esc(o.address)+(o.comment?'<br>'+esc(o.comment):"")+'</div><div>'+o.items.map(function(i){return esc(i.name)+' × '+i.qty}).join('<br>')+'</div><div class="r" style="margin-top:8px"><select data-s="'+o.id+'">'+Object.keys(S).map(function(k){return '<option value="'+k+'"'+(o.status===k?' selected':'')+'>'+S[k]+'</option>'}).join("")+'</select></div></div>'}).join("")||'<div class="m">Заказов пока нет</div>'
}).catch(function(e){$("err").textContent=e.message;if(e.message==="Неверный пароль"){$("app").hidden=true;$("err").innerHTML='Неверный пароль. <button id="li">Войти</button>'}})}
function clear(){["id","n","pr","d","f"].forEach(function(i){$(i).value=""});$("c").value="Посуда";$("so").value=0;$("a").checked=true;img="";$("fs").textContent=""}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.id==="li")login();
  else if(t.id==="reset")clear();
  else if(t.dataset.e){var p=PS.filter(function(x){return x.id==t.dataset.e})[0];$("id").value=p.id;$("n").value=p.name;$("c").value=p.category;$("pr").value=p.price;$("so").value=p.sort;$("d").value=p.description;$("a").checked=p.active;img=p.image_url;$("fs").textContent=img?"Текущее фото сохранится, если не выбрать новое":"";scrollTo(0,0)}
  else if(t.dataset.x){if(confirm("Удалить товар?"))api("DELETE","/api/admin/products/"+t.dataset.x).then(load).catch(function(e){$("err").textContent=e.message})}
  else if(t.id==="save"){t.disabled=true;$("err").textContent="";
    var up=$("f").files[0]?(function(){var fd=new FormData();fd.append("file",$("f").files[0]);return api("POST","/api/admin/upload",fd,true).then(function(r){img=r.url})})():Promise.resolve();
    up.then(function(){var b={name:$("n").value,category:$("c").value,price:$("pr").value,sort:$("so").value,description:$("d").value,active:$("a").checked,image_url:img};
      return $("id").value?api("PUT","/api/admin/products/"+$("id").value,b):api("POST","/api/admin/products",b)}).then(function(){clear();load()}).catch(function(e){$("err").textContent=e.message}).then(function(){t.disabled=false})}
});
document.addEventListener("change",function(e){if(e.target.dataset.s)api("PATCH","/api/admin/orders/"+e.target.dataset.s,{status:e.target.value}).catch(function(x){$("err").textContent=x.message})});
T?load():login();
</script></body></html>
