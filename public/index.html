<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ваш магазин</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Ваш магазин</h1><p>Кухонные товары и полезные приспособления для дома</p></div><button id="cartBtn">🛒 <span id="cartCount">0</span></button></header><main><section id="catalog" class="grid"></section><section id="cart" class="panel hidden"><h2>Корзина</h2><div id="cartItems"></div><div class="total">Итого: <b id="total">0 ₽</b></div><button class="primary" id="checkoutBtn">Оформить заказ</button></section><section id="checkout" class="panel hidden"><h2>Оформление заказа</h2><label>Имя<input id="name" placeholder="Ваше имя"></label><label>Телефон<input id="phone" placeholder="+7 ..."></label><label>Адрес / ПВЗ Ozon<input id="delivery" placeholder="Адрес или ПВЗ"></label><button class="primary" id="sendOrder">Подтвердить заказ</button><p class="hint">Выбор ПВЗ и расчёт доставки Ozon подключим следующим этапом.</p></section></main><script>const state={products:[],cart:[]};async function load(){state.products=await fetch('/api/products').then(r=>r.json());render()}function money(v){return new Intl.NumberFormat('ru-RU').format(v)+' ₽'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('catalog').innerHTML=state.products.filter(p=>p.active&&p.stock!==0).map(p=>`<article class="card">${p.image?`<img src="${p.image}" alt="">`:`<div class="noimg">Фото товара</div>`}<div class="cardbody"><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="row"><strong>${money(p.price)}</strong><button onclick="add('${p.id}')">В корзину</button></div></div></article>`).join('')||'<div class="empty">Добавьте первый товар через админку.</div>';document.getElementById('cartCount').textContent=state.cart.reduce((s,x)=>s+x.qty,0);renderCart()}function add(id){const p=state.products.find(x=>x.id===id),i=state.cart.find(x=>x.id===id);if(i)i.qty++;else state.cart.push({id, name:p.name, price:p.price, qty:1});render()}function renderCart(){document.getElementById('cartItems').innerHTML=state.cart.map(x=>`<div class="cartrow"><span>${esc(x.name)}</span><span>${x.qty} × ${money(x.price)}</span></div>`).join('')||'Корзина пуста';document.getElementById('total').textContent=money(state.cart.reduce((s,x)=>s+x.price*x.qty,0))}document.getElementById('cartBtn').onclick=()=>document.getElementById('cart').classList.toggle('hidden');document.getElementById('checkoutBtn').onclick=()=>document.getElementById('checkout').classList.remove('hidden');document.getElementById('sendOrder').onclick=async()=>{const payload={customer:{name:document.getElementById('name').value,phone:document.getElementById('phone').value},items:state.cart,delivery:document.getElementById('delivery').value};const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok)return alert(d.error||'Ошибка');alert('Заказ принят: '+d.order.id);state.cart=[];render();document.getElementById('checkout').classList.add('hidden')};load();</script></body></html>
