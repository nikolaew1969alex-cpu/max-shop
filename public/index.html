<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ваш магазин</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Ваш магазин</h1><p>Кухонные товары и полезные приспособления для дома</p></div><button id="cartBtn" class="cart-btn">🛒 <span id="cartLabel">Корзина</span> <span id="cartCount">0</span></button></header><main><section id="catalog" class="grid"></section><section id="cart" class="panel hidden"><h2>Корзина</h2><div id="cartItems"></div><div class="total">Итого: <b id="total">0 ₽</b></div><button class="primary" id="checkoutBtn">Перейти к оформлению</button></section><section id="checkout" class="panel hidden"><h2>Оформление заказа</h2><div id="checkoutSummary" class="summary"></div><label>Имя<input id="name" autocomplete="name" placeholder="Ваше имя"></label><label>Телефон<input id="phone" autocomplete="tel" placeholder="+7 ..."></label><label>Доставка<input id="delivery" autocomplete="street-address" placeholder="Адрес или ПВЗ"></label><button class="primary" id="sendOrder">Подтвердить заказ</button><button id="backToCart" class="secondary">Вернуться в корзину</button><p class="hint">Доставку пока оформляем по указанному адресу или ПВЗ.</p></section><section id="success" class="panel hidden success"><h2>Заказ оформлен 🎉</h2><p>Номер заказа:</p><strong id="orderId"></strong><p>Мы получили заказ и ваши контактные данные.</p><button class="primary" id="continue">Вернуться в магазин</button></section></main><script>const state={products:[],cart:[]};const $=id=>document.getElementById(id);async function load(){state.products=await fetch('/api/products').then(r=>r.json());render()}function money(v){return new Intl.NumberFormat('ru-RU').format(v)+' ₽'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}function gallery(p){const media=[];(p.images?.length?p.images:[p.image]).filter(Boolean).forEach(u=>media.push(`<img src="${u}" alt="${esc(p.name)}">`));if(p.video)media.push(`<video src="${p.video}" controls playsinline preload="metadata"></video>`);if(!media.length)return '<div class="noimg">Фото товара</div>';return `<div class="gallery" data-index="0"><div class="gallery-track">${media.map((m,i)=>`<div class="gallery-slide">${m}</div>`).join('')}</div>${media.length>1?`<button class="gallery-prev" onclick="moveGallery(this,-1)">‹</button><button class="gallery-next" onclick="moveGallery(this,1)">›</button><div class="gallery-dots">${media.map((_,i)=>`<i class="${i?'':'active'}"></i>`).join('')}</div>`:''}</div>`}function render(){ $('catalog').innerHTML=state.products.filter(p=>p.active&&p.stock!==0).map(p=>`<article class="card">${gallery(p)}<div class="cardbody"><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="row"><strong>${money(p.price)}</strong><button class="add-btn" onclick="add('${p.id}')">В корзину</button></div></div></article>`).join('')||'<div class="empty">Добавьте первый товар через админку.</div>';updateCartUI();renderCart()}function moveGallery(btn,delta){const g=btn.closest('.gallery'),track=g.querySelector('.gallery-track'),count=track.children.length;let i=Number(g.dataset.index||0)+delta;if(i<0)i=count-1;if(i>=count)i=0;g.dataset.index=i;track.style.transform=`translateX(-${i*100}%)`;g.querySelectorAll('.gallery-dots i').forEach((d,n)=>d.classList.toggle('active',n===i))}function add(id){const p=state.products.find(x=>x.id===id);if(!p)return;const i=state.cart.find(x=>x.id===id);if(i)i.qty++;else state.cart.push({id:p.id,name:p.name,price:p.price,qty:1});render()}function changeQty(id,delta){const i=state.cart.find(x=>x.id===id);if(!i)return;i.qty+=delta;if(i.qty<1)state.cart=state.cart.filter(x=>x.id!==id);render()}function updateCartUI(){const count=state.cart.reduce((s,x)=>s+x.qty,0);$('cartCount').textContent=count;$('cartBtn').classList.toggle('has-items',count>0);$('cartLabel').textContent=count?'Корзина — в корзине':'Корзина';document.querySelectorAll('.add-btn').forEach(b=>{const card=b.closest('.card'),name=card?.querySelector('h3')?.textContent||'',inCart=state.cart.some(x=>x.name===name);b.classList.toggle('added',inCart);b.textContent=inCart?'✓ В корзине':'В корзину'})}function renderCart(){$('cartItems').innerHTML=state.cart.map(x=>`<div class="cartrow"><span><b>${esc(x.name)}</b><br><small>${money(x.price)} × ${x.qty}</small></span><span class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeQty('${x.id}',1)">+</button></span></div>`).join('')||'<div class="empty">Корзина пуста</div>';const total=state.cart.reduce((s,x)=>s+x.price*x.qty,0);$('total').textContent=money(total);$('checkoutSummary').innerHTML=state.cart.length?state.cart.map(x=>`<div>${esc(x.name)} × ${x.qty} — <b>${money(x.price*x.qty)}</b></div>`).join('')+'<hr><div><b>Итого: '+money(total)+'</b></div>':''}function show(id){['catalog','cart','checkout','success'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='checkout')renderCart()}$('cartBtn').onclick=()=>show('cart');$('checkoutBtn').onclick=()=>{if(!state.cart.length)return alert('Добавьте товар в корзину');show('checkout')};$('backToCart').onclick=()=>show('cart');$('continue').onclick=()=>show('catalog');$('sendOrder').onclick=async()=>{if(!state.cart.length)return alert('Корзина пуста');const name=$('name').value.trim(),phone=$('phone').value.trim(),delivery=$('delivery').value.trim();if(!name||!phone||!delivery)return alert('Заполните имя, телефон и адрес/ПВЗ');const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:{name,phone},items:state.cart,delivery})});const d=await r.json();if(!r.ok)return alert(d.error||'Не удалось оформить заказ');$('orderId').textContent=d.order.id;state.cart=[];$('name').value='';$('phone').value='';$('delivery').value='';show('success');updateCartUI()};load();</script></body></html>
