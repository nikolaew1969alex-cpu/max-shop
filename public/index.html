<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ваш магазин</title><style>:root{--bg:#eef3f4;--card:#fff;--ink:#17323a;--mute:#5d7279;--line:#d5e0e3;--acc:#f2b632;--accink:#3a2a00;--tile:#e2edf0}@media(prefers-color-scheme:dark){:root{--bg:#0f1f24;--card:#172b32;--ink:#e8f1f3;--mute:#93a9af;--line:#26414a;--tile:#1f3a43}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px}header{padding:20px 16px 8px;max-width:760px;margin:auto}h1{margin:0 0 4px;font-size:28px}header p{margin:0;color:var(--mute)}.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px;max-width:760px;margin:auto}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;white-space:nowrap}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:4px 16px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.pic{height:150px;background:var(--tile);position:relative;display:grid;place-items:center}.pic img,.pic video{width:100%;height:100%;object-fit:cover}.media-count{position:absolute;right:8px;bottom:8px;background:#000b;color:#fff;border-radius:14px;padding:4px 8px;font-size:12px}.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}.name{font-weight:700}.desc{font-size:13px;color:var(--mute);min-height:36px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.price{font-weight:800}.add,.main{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:9px 12px;font-weight:800}.qty{display:flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}.bar button{display:flex;justify-content:space-between;width:100%;max-width:728px;margin:auto;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px 18px;font-weight:700}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:10}.sheet.open{display:flex}.panel{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 12px}.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.line .t{flex:1}.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:14px 0}label{display:block;font-size:14px;color:var(--mute);margin-top:10px}input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}.main{width:100%;padding:14px;margin-top:6px}.link{background:none;border:0;color:var(--mute);padding:10px 0;width:100%}.err{color:#c0392b;min-height:20px}.empty{text-align:center;color:var(--mute);padding:24px;grid-column:1/-1}.gallery{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.gallery img,.gallery video{width:78px;height:78px;object-fit:cover;border-radius:10px;border:2px solid transparent;flex:none}.gallery .sel{border-color:var(--acc)}.hero{width:100%;height:300px;object-fit:contain;background:var(--tile);border-radius:12px}.contact{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:12px 0}.contact a{display:inline-block;margin:5px 6px 0 0;text-decoration:none}.contact .main{display:inline-block;width:auto;color:var(--accink)}</style></head><body><header><h1>Ваш магазин</h1><p>Кухонные товары и полезные приспособления для дома</p></header><div class="chips" id="chips"></div><main class="grid" id="grid"><div class="empty">Загружаем товары…</div></main><div class="bar"><button id="cartBtn" disabled><span id="cc">Корзина пуста</span><span id="cs"></span></button></div><div class="sheet" id="sheet"><div class="panel" id="panel"></div></div><script>var P=[],cart={},cat='Все',$=id=>document.getElementById(id),settings={};try{cart=JSON.parse(localStorage.getItem('cart')||'{}')||{}}catch(e){}const fmt=n=>Number(n).toLocaleString('ru-RU')+' ₽';const esc=s=>{let d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const save=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};const items=()=>P.filter(p=>cart[p.id]).map(p=>({p,q:cart[p.id]}));const total=()=>items().reduce((a,x)=>a+x.p.price*x.q,0);const count=()=>items().reduce((a,x)=>a+x.q,0);function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();render();if($('sheet').classList.contains('open'))openCart()}function firstMedia(p){return(p.media&&p.media.length?p.media:[])[0]||null}function mediaHtml(p){let m=firstMedia(p);if(!m&&p.image_url)m={url:p.image_url,media_type:'image'};if(!m)return'🛍️';return m.media_type==='video'?'<video src="'+esc(m.url)+'" muted playsinline preload="metadata"></video>':'<img src="'+esc(m.url)+'" alt="" loading="lazy">'}function render(){let cats=['Все'].concat(P.map(p=>p.category).filter((v,i,a)=>a.indexOf(v)===i));$('chips').innerHTML=cats.length>1?cats.map(c=>'<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join(''):'';let list=P.filter(p=>cat==='Все'||p.category===cat);$('grid').innerHTML=list.length?list.map(p=>{let q=cart[p.id],mc=(p.media||[]).length+(p.media?.length?0:(p.image_url?1:0));let act=q?'<div class="qty"><button data-m="'+p.id+'">−</button><b>'+q+'</b><button data-a="'+p.id+'">+</button></div>':'<button class="add" data-a="'+p.id+'">В корзину</button>';return'<article class="card"><div class="pic" data-view="'+p.id+'">'+mediaHtml(p)+(mc>1?'<span class="media-count">'+mc+' фото/видео</span>':'')+'</div><div class="body"><div class="name">'+esc(p.name)+'</div><div class="desc">'+esc(p.description)+'</div><div class="row"><span class="price">'+fmt(p.price)+'</span>'+act+'</div></div></article>'}).join(''):'<div class="empty">Товаров пока нет</div>';let n=count();$('cartBtn').disabled=!n;$('cc').textContent=n?'Корзина: '+n+' шт.':'Корзина пуста';$('cs').textContent=n?fmt(total()):''}function openProduct(id){let p=P.find(x=>x.id==id);if(!p)return;let ms=(p.media||[]).slice();if(!ms.length&&p.image_url)ms=[{url:p.image_url,media_type:'image'}];let hero=ms[0];$('panel').innerHTML='<h2>'+esc(p.name)+'</h2>'+(hero?(hero.media_type==='video'?'<video class="hero" src="'+esc(hero.url)+'" controls playsinline></video>':'<img class="hero" src="'+esc(hero.url)+'" alt="">'):'<div class="hero">🛍️</div>')+(ms.length>1?'<div class="gallery">'+ms.map((m,i)=>(m.media_type==='video'?'<video data-mi="'+i+'" class="'+(!i?'sel':'')+'" src="'+esc(m.url)+'" muted></video>':'<img data-mi="'+i+'" class="'+(!i?'sel':'')+'" src="'+esc(m.url)+'">')).join('')+'</div>':'')+'<p>'+esc(p.description)+'</p><div class="price">'+fmt(p.price)+'</div><button class="main" data-a="'+p.id+'">Добавить в корзину</button><button class="link" id="close">Закрыть</button>';$('sheet').classList.add('open');$('panel').dataset.media=JSON.stringify(ms)}function openCart(){let l=items().map(x=>'<div class="line"><div class="t"><b>'+esc(x.p.name)+'</b><div>'+fmt(x.p.price)+'</div></div><div class="qty"><button data-m="'+x.p.id+'">−</button><b>'+x.q+'</b><button data-a="'+x.p.id+'">+</button></div></div>').join('');if(!l){$('sheet').classList.remove('open');return}$('panel').innerHTML='<h2>Корзина</h2>'+l+'<div class="total"><span>Итого</span><span>'+fmt(total())+'</span></div><button class="main" id="go">Оформить заказ</button><button class="link" id="close">Продолжить покупки</button>';$('sheet').classList.add('open')}function form(){$('panel').innerHTML='<h2>Оформление заказа</h2><label>Имя</label><input id="fn" autocomplete="name"><label>Телефон</label><input id="fp" type="tel" autocomplete="tel" placeholder="+7"><label>Адрес доставки</label><textarea id="fa" rows="2"></textarea><label>Комментарий</label><input id="fc"><div class="err" id="err"></div><div class="total"><span>К оплате</span><span>'+fmt(total())+'</span></div><button class="main" id="send">Отправить заказ</button><button class="link" id="back">Назад</button>'}function contactHtml(m){if(!m||(!m.phone&&!m.max_url&&!m.telegram_url))return'';return'<div class="contact"><b>Связь с '+esc(m.name||'менеджером')+'</b>'+(m.phone?'<div>Телефон: '+esc(m.phone)+'</div>':'')+(m.max_url?'<a class="main" href="'+esc(m.max_url)+'" target="_blank" rel="noopener">Написать в MAX</a>':'')+(m.telegram_url?'<a class="main" href="'+esc(m.telegram_url)+'" target="_blank" rel="noopener">Telegram</a>':'')+'</div>'}document.addEventListener('click',e=>{let t=e.target.closest('button,[data-view],[data-mi]');if(!t){if(e.target===$('sheet'))$('sheet').classList.remove('open');return}if(t.dataset.c){cat=t.dataset.c;render()}else if(t.dataset.a)chg(+t.dataset.a,1);else if(t.dataset.m)chg(+t.dataset.m,-1);else if(t.dataset.view)openProduct(+t.dataset.view);else if(t.dataset.mi){let ms=JSON.parse($('panel').dataset.media||'[]'),m=ms[+t.dataset.mi];if(!m)return;let old=$('panel').querySelector('.hero');let el=m.media_type==='video'?document.createElement('video'):document.createElement('img');el.className='hero';el.src=m.url;if(m.media_type==='video'){el.controls=true;el.playsInline=true}old.replaceWith(el);$('panel').querySelectorAll('[data-mi]').forEach(x=>x.classList.remove('sel'));t.classList.add('sel')}else if(t.id==='cartBtn')openCart();else if(t.id==='go')form();else if(t.id==='back')openCart();else if(t.id==='close')$('sheet').classList.remove('open');else if(t.id==='send'){let b={name:$('fn').value,phone:$('fp').value,address:$('fa').value,comment:$('fc').value,items:items().map(x=>({id:x.p.id,qty:x.q}))};t.disabled=true;fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json().then(j=>({ok:r.ok,j}))).then(r=>{if(!r.ok){$('err').textContent=r.j.error||'Ошибка';t.disabled=false;return}cart={};save();render();$('panel').innerHTML='<h2>Заказ принят</h2><p>Номер заказа: <b>'+r.j.id+'</b>.</p>'+contactHtml(r.j.manager)+'<button class="main" id="close">Закрыть</button>'}).catch(()=>{$('err').textContent='Нет связи с сервером';t.disabled=false})}});Promise.all([fetch('/api/products').then(r=>r.json()),fetch('/api/settings').then(r=>r.json())]).then(a=>{P=a[0];settings=a[1];Object.keys(cart).forEach(id=>{if(!P.some(p=>p.id==id))delete cart[id]});render()}).catch(()=>{$('grid').innerHTML='<div class="empty">Не удалось загрузить магазин. Обновите страницу.</div>'});</script></body></html>
